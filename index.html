<!DOCTYPE html><html><head><title>Scam Guard Ghana</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#0f0f0f;color:#fff;padding:15px} .card{background:#1e1e1e;padding:20px;border-radius:12px} textarea{width:100%;height:110px;border-radius:8px;padding:10px} button{background:#00ff88;color:#000;padding:14px;width:100%;border:none;border-radius:8px;font-weight:bold;margin-top:10px} #res{margin-top:15px;padding:15px;background:#2a2a2a;border-radius:8px}</style></head><body><div class="card"><h2>🇬🇭 Scam Guard Ghana</h2><p>By Dreama - Stop MoMo Fraud</p><textarea id="m" placeholder="Paste message here... e.g You have won 5000ghc send MoMo"></textarea><button onclick="c()">Check If Scam</button><div id="res">Result will show here...</div></div><script>function c(){let t=document.getElementById('m').value.toLowerCase();let w=["you have won","send momo","urgent","blocked account","verify your pin","lottery","claim now","momo agent"];let s=0;for(let x of w)if(t.includes(x))s++;let r=document.getElementById('res');if(s>=2)r.innerHTML="🚨 SCAM! 99% Fraud! Don't send money!";else if(s==1)r.innerHTML="⚠️ SUSPICIOUS! Be careful ooh!";else r.innerHTML="✅ Looks SAFE but still be careful.";}</script></body></html>
