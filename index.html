<script>
function checkScam() {
  let msg = document.getElementById('msgBox').value.toLowerCase();
  let result = document.getElementById('result');
  
  // GHANA SCAM KEYWORDS - Dreama's upgraded list
  let scams = ["won", "win", "lottery", "send momo", "momo pin", "pin", "ur pin", "your pin", "send your pin", "i have sent", "i have send", "mistakenly sent", "wrong transaction", "send back", "refund", "055", "024", "020", "059", "block your account", "verify your account", "ghs", "ghc"];
  
  let isScam = scams.some(word => msg.includes(word));
  
  if (isScam) {
    result.innerHTML = "🚨 SCAM! 99% Fraud! Don't send money or PIN! Delete this message!";
    result.style.background = "red";
    result.style.color = "white";
  } else {
    result.innerHTML = "✅ Looks SAFE but still be careful.";
    result.style.background = "#333";
    result.style.color = "white";
  }
}
</script>
